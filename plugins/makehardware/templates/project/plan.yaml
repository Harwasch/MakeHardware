# Project plan — the agreement about what work exists and in what order.
#
# One chunk ≈ one AI session. Keep chunks at the altitude of "a thing you could
# hand to a session and get a reviewable result back", not individual tasks.
#
#   status:       todo | in_progress | blocked | done
#   depends_on:   chunk ids that must finish first (this drives the schedule)
#   discipline:   groups rows in the chart; use only what the project needs
#   outputs:      files this chunk must produce — checked against the disk
#   review:       id of the human review that must be signed off first
#   description:  what this chunk actually is; goes into docs/plan.md
#
# Render with:   plan-render          (docs/plan.{svg,md,drawio} + README block)
# Validate with: plan-render --check  (cycles, dangling deps, and `done` claims
#                                      whose outputs are missing or whose review
#                                      is unsigned or stale — exit 1)
#
# No chunk below is `done`, deliberately. `done` is a claim about the
# filesystem and about a human's agreement, and --check tests both: the files
# in `outputs` must exist, and the review named in `review` must be signed off
# in docs/review/reviews.yaml. Marking a chunk done before either is true is
# how a status report quietly becomes wrong.

project: Example Widget
disciplines: [mechanical, electrical, firmware, test]

chunks:
  - id: V1
    title: Vision board and concept selection
    description: >-
      Interview, then two concepts as build123d modules, rendered into a
      vision document the human can read on GitHub.
    discipline: mechanical
    status: in_progress
    depends_on: []
    estimate_sessions: 1
    review: vision
    outputs: [concepts/, docs/design/vision.md, docs/design/vision/]

  - id: R1
    title: System requirements from agreed vision
    description: >-
      VIS- intent decomposed into testable SYS- requirements with numbers and
      units, validated and drawn as a requirements map.
    discipline: mechanical
    status: todo
    depends_on: [V1]
    estimate_sessions: 1
    review: requirements
    outputs:
      - requirements/00-vision.sdoc
      - requirements/10-system.sdoc
      - docs/design/requirements-map.svg

  - id: M1
    title: Enclosure envelope and internal layout
    discipline: mechanical
    status: todo
    depends_on: [R1]
    estimate_sessions: 1
    outputs: [cad/enclosure.py]

  - id: M2
    title: Thermal check on the enclosure
    discipline: mechanical
    status: todo
    depends_on: [M1, E2]
    estimate_sessions: 1
    outputs: [sim/thermal/]

  - id: E1
    title: Power architecture and part selection
    discipline: electrical
    status: todo
    depends_on: [R1]
    estimate_sessions: 1
    outputs: [docs/design/adr-0002-power.md]

  - id: E1B
    title: Electrical block diagram and power budget
    discipline: electrical
    status: todo
    depends_on: [E1]
    estimate_sessions: 1
    review: architecture
    outputs: [hw/block-diagram.yaml, docs/design/block-diagram.svg]

  - id: E2
    title: Schematic capture and ERC
    discipline: electrical
    status: todo
    depends_on: [E1B]
    estimate_sessions: 2
    review: schematic
    outputs: [hw/widget.kicad_sch, docs/design/schematic.pdf]

  - id: E3
    title: PCB layout, DRC and fabrication outputs
    discipline: electrical
    status: blocked
    depends_on: [E2, M1]
    estimate_sessions: 2
    review: layout
    outputs: [hw/widget.kicad_pcb, docs/design/pcb-layers.pdf]

  - id: F1
    title: Firmware bring-up skeleton
    discipline: firmware
    status: todo
    depends_on: [E1]
    estimate_sessions: 1
    outputs: [fw/]

  - id: T1
    title: Verification run and traceability gate
    discipline: test
    status: todo
    depends_on: [E3, M2, F1]
    estimate_sessions: 1
    outputs: [docs/design/verification-report.md]
